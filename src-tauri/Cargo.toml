[package]
name = "openrail"
version = "0.1.0"
description = "OpenRail independent OpenBVE-compatible railway platform"
authors = ["Danny Iswandyy"]
edition = "2021"

[lib]
name = "openrail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0" }

[dependencies]
tauri = { version = "2.9.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
