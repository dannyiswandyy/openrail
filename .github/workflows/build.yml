name: OpenRail Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Build OpenRail Windows installer
        run: npm run tauri build -- --bundles nsis

      - name: Verify Windows bundles
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction Stop
          Write-Host "Installer:"
          $installer | ForEach-Object { Write-Host $_.FullName }
          if (-not $installer) { throw "No NSIS installer was produced." }

      - name: Upload OpenRail Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: OpenRail-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/openrail.exe
          if-no-files-found: error
          retention-days: 30
