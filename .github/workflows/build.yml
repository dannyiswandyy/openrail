name: OpenRail CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openrail-main-build
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npm run build

  rust:
    name: Rust tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - name: Generate Tauri icons
        run: npm run tauri -- icon src-tauri/icons/app-icon.svg
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    name: Windows OpenRail EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Generate Tauri icons
        run: npm run tauri -- icon src-tauri/icons/app-icon.svg
      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis
      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction Stop
          if (-not $files) { throw "OpenRail installer was not produced." }
          $files | ForEach-Object { Write-Host $_.FullName }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenRail-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
