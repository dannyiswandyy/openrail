# Builds OpenRail installers for Windows, Linux and macOS and publishes them to Releases.
name: Build OpenRail

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install packages
        run: npm install

      - name: Make app icons
        run: npx tauri icon src-tauri/app-icon.png

      - name: Build the interface
        run: npm run build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: openrail-v__VERSION__-build${{ github.run_number }}
          releaseName: OpenRail v__VERSION__ (build ${{ github.run_number }})
          releaseBody: |
            Windows: download the .msi or -setup.exe file.
            Linux: .AppImage or .deb.  macOS (Apple Silicon): .dmg.
          releaseDraft: false
          prerelease: false
