      - name: Build the interface
        run: npm run build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: openrail-v__VERSION__-build${{ github.run_number }}
          releaseName: OpenRail v__VERSION__ (build ${{ github.run_number }})
          releaseBody: |
            Windows: download the .msi or -setup.exe file.
            Linux: .AppImage or .deb.  macOS (Apple Silicon): .dmg.
          releaseDraft: false
          prerelease: false
