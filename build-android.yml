              const rr = [-fr[2], 0, fr[0]];
              b.box(add(g, [0, h / 2, 0]), fr, rr, UP, d, w, h, col);
              // window bands
              for (let y = 3; y < h - 2; y += 3) b.box(add(g, [0, y, 0]), fr, rr, UP, d + 0.1, w + 0.1, 0.7, shade(col, 0.55));
              b.box(add(g, [0, h + 0.4, 0]), fr, rr, UP, d * 0.4, w * 0.5, 0.8, shade(col, 0.7));
            }
            for (let i = 0; i < 26; i++) { // trees
              const s = s0 + R() * (s1 - s0), F = frameAt(tr, s), side = R() < 0.5 ? -1 : 1;
              let off = 8 + R() * 30;
              if (F.radius && Math.sign(F.radius) === side) off = Math.min(off, Math.abs(F.radius) * 0.6);
              if (off < 7) continue;
              if (route.stations.some(st => s > st.stop - 160 && s < st.stop + 15) && off < 9) continue;
              const g = add(add(F.p, scl(F.r, side * off)), [0, -F.ht, 0]), h = 4 + R() * 6, cw = 3 + R() * 3;
              b.box(add(g, [0, h * 0.3, 0]), F.f, F.r, UP, 0.4, 0.4, h * 0.6, [0.35, 0.26, 0.18]);
              b.box(add(g, [0, h * 0.75, 0]), F.f, F.r, UP, cw, cw, h * 0.55, [0.16 + R() * .08, 0.36 + R() * .1, 0.14]);
            }
            return b;
          }
          
          function signTexture(gl, text) {
            const c = document.createElement("canvas"); c.width = 512; c.height = 96;
            const x = c.getContext("2d");
            x.fillStyle = "#1d2a36"; x.fillRect(0, 0, 512, 96);
            x.fillStyle = "#00a650"; x.fillRect(0, 0, 14, 96);
            x.fillStyle = "#fff"; x.font = "bold 46px system-ui,sans-serif"; x.textBaseline = "middle";
            x.fillText(text.slice(0, 18), 36, 50);
            const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
            gl.generateMipmap(gl.TEXTURE_2D);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
            return t;
          }
          
          /* ================================================================
             5. APP
          ================================================================ */
          function startApp(routeText) {
            const canvas = document.getElementById("c");
            const gl = canvas.getContext("webgl2", { antialias: true });
            if (!gl) { alert("This browser does not support WebGL2."); return; }
            const route = parseRoute(routeText);
            if (route.length < 500) { alert("That route looks empty - no track positions found."); return; }
            const tr = buildTrack(route);
            const sim = makeSim(route);
            const prog = compile(gl, VS, FS), sky = compile(gl, SKY_VS, SKY_FS);
            const skyVAO = gl.createVertexArray();
            const chunks = new Map();
            const sun = norm([0.45, 0.75, 0.35]), fog = [0.74, 0.80, 0.86];
          
            // station signs
            const signs = route.stations.map(st => {
              const b = new Builder(), side = st.side > 0 ? 1 : -1;
              for (let s = st.stop - 130; s < st.stop; s += 40) {
                const F = frameAt(tr, s), c = add(add(F.p, scl(F.r, side * 1.95)), [0, 4.4, 0]);
                const hf = scl(F.f, 1.6), hu = [0, 0.3, 0];
                // face the track
                const a = sub(sub(c, hf), hu), bb = add(sub(c, hu), hf), cc = add(add(c, hu), hf), d = add(sub(c, hf), hu);
                if (side < 0) b.quad(a, bb, cc, d, [1, 1, 1], [[0, 1], [1, 1], [1, 0], [0, 0]]);
                else b.quad(bb, a, d, cc, [1, 1, 1], [[0, 1], [1, 1], [1, 0], [0, 0]]);
              }
              return { mesh: upload(gl, b), tex: signTexture(gl, st.name) };
            });
            // lamp mesh (unit cube)
            const LF = [0, 0, -1], LR = [1, 0, 0], LU = [0, 1, 0]; // local axes: forward = -z
            const lampB = new Builder(); lampB.box([0, 0, 0], LF, LR, LU, 1, 1, 1, [1, 1, 1], false);
            const lamp = upload(gl, lampB);
            // train car (local coords, front of the car at z = -CAR/2)
            const CAR = 23, GAP = 0.6;
            const carMesh = lead => {
              const b = new Builder(), body = [0.90, 0.91, 0.92];
              b.box([0, 2.05, 0], LF, LR, LU, CAR, 3.15, 3.1, body, false);
              b.box([0, 2.55, 0], LF, LR, LU, CAR - 1.2, 3.2, 1.0, [0.10, 0.12, 0.15]);   // window band
              b.box([0, 1.55, 0], LF, LR, LU, CAR + 0.02, 3.18, 0.22, [0.85, 0.05, 0.12]); // red stripe
              b.box([0, 1.32, 0], LF, LR, LU, CAR + 0.02, 3.18, 0.16, [0.00, 0.60, 0.30]); // green stripe
              b.box([0, 0.45, 0], LF, LR, LU, CAR - 4, 2.6, 0.5, [0.18, 0.18, 0.2]);     // underframe
              for (const z of [-CAR / 2 + 3, CAR / 2 - 3]) b.box([0, 0.45, z], LF, LR, LU, 2.6, 2.2, 0.7, [0.12, 0.12, 0.13]); // bogies
              if (lead) {
                b.box([0, 2.6, -CAR / 2 - 0.05], LF, LR, LU, 0.12, 2.6, 1.2, [0.05, 0.06, 0.08]);           // windscreen
                for (const x of [-1.1, 1.1]) b.box([x, 1.0, -CAR / 2 - 0.06], LF, LR, LU, 0.1, 0.35, 0.18, [1, 1, 0.9, 1]); // headlights
              }
              return upload(gl, b);
            };
            const carLead = carMesh(true), carMid = carMesh(false);
            const NCARS = 6;
            function modelAt(s, yOff = 0) {
              const A = frameAt(tr, s + CAR / 2 - 3), B = frameAt(tr, s - CAR / 2 + 3); // between bogie centres
              const p = scl(add(A.p, B.p), 0.5), f = norm(sub(A.p, B.p)), r = norm(cross(f, [0, 1, 0])), u = cross(r, f);
              return new Float32Array([r[0], r[1], r[2], 0, u[0], u[1], u[2], 0, -f[0], -f[1], -f[2], 0, p[0], p[1] + yOff, p[2], 1]);
            }
            // ground plane (follows camera)
            const gB = new Builder(); gB.quad([-3000, 0, 3000], [3000, 0, 3000], [3000, 0, -3000], [-3000, 0, -3000], [1, 1, 1]);
            const ground = upload(gl, gB);
          
            function chunk(k) {
              if (!chunks.has(k)) chunks.set(k, upload(gl, buildChunk(route, tr, k)));
              return chunks.get(k);
            }
          
            // ---------- UI ----------
            const $ = id => document.getElementById(id);
            const leverEl = $("lever");
            for (let n = NOTCH_MAX; n >= NOTCH_MIN; n--) {
              const d = document.createElement("div");
              d.className = "st " + (n > 0 ? "p" : n === -8 ? "eb" : n < 0 ? "b" : "");
              d.textContent = notchName(n); d.dataset.n = n; leverEl.appendChild(d);
            }
            const setNotch = n => { if (sim.ato) { sim.ato = false; toast("ATO off"); } sim.notch = Math.max(NOTCH_MIN, Math.min(NOTCH_MAX, n)); if (n === -8) sim.ebLatch = true; };
            const leverPick = e => {
              const r = leverEl.getBoundingClientRect(), rows = NOTCH_MAX - NOTCH_MIN + 1;
              const idx = Math.max(0, Math.min(rows - 1, Math.floor((e.clientY - r.top) / r.height * rows)));
              const n = NOTCH_MAX - idx;
              if (n !== sim.notch) setNotch(n);
            };
            leverEl.addEventListener("pointerdown", e => { leverEl.setPointerCapture(e.pointerId); leverPick(e); });
            leverEl.addEventListener("pointermove", e => { if (e.buttons) leverPick(e); });
          
            const input = { openDoors: false, closeDoors: false };
            let camMode = 0;
            const doorBtn = () => { if (sim.doors === "open") input.closeDoors = true; else input.openDoors = true; };
            const atoBtn = () => { sim.ato = !sim.ato; toast(sim.ato ? "ATO engaged - the train drives itself" : "ATO off"); };
            $("bDoor").onclick = doorBtn; $("bATO").onclick = atoBtn;
            $("bCam").onclick = () => camMode = (camMode + 1) % 3;
            $("bHorn").onclick = horn;
            addEventListener("keydown", e => {
              const k = e.key.toLowerCase();
              if (k === "w" || k === "arrowup" || k === "z") setNotch(sim.notch + 1);
              else if (k === "s" || k === "arrowdown" || k === "a") setNotch(sim.notch - 1);
              else if (k === "backspace") { e.preventDefault(); setNotch(-8); }
              else if (k === "d") doorBtn(); else if (k === "o") atoBtn();
              else if (k === "c") camMode = (camMode + 1) % 3; else if (k === "h") horn();
            });
            let toastT = 0;
            function toast(m) { const t = $("toast"); t.textContent = m; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 2600); }
          
            // ---------- sound (WebAudio, generated) ----------
            const AC = window.AudioContext || window.webkitAudioContext, ac = AC ? new AC() : null;
            let motor, motorGain, rumbleGain;
            if (ac) {
              motor = ac.createOscillator(); motor.type = "sawtooth"; motorGain = ac.createGain(); motorGain.gain.value = 0;
              const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
              motor.connect(lp).connect(motorGain).connect(ac.destination); motor.start();
              const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = buf.getChannelData(0);
              for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
              const noise = ac.createBufferSource(); noise.buffer = buf; noise.loop = true;
              const nf = ac.createBiquadFilter(); nf.type = "lowpass"; nf.frequency.value = 220;
              rumbleGain = ac.createGain(); rumbleGain.gain.value = 0; noise.connect(nf).connect(rumbleGain).connect(ac.destination); noise.start();
            }
            function horn() {
              if (!ac) return;
              const g = ac.createGain(); g.gain.setValueAtTime(0.0001, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.25, ac.currentTime + 0.05);
              g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.9); g.connect(ac.destination);
              for (const f of [311, 370]) { const o = ac.createOscillator(); o.type = "square"; o.frequency.value = f; o.connect(g); o.start(); o.stop(ac.currentTime + 0.95); }
            }
          
            // ---------- loop ----------
            function resize() {
              const dpr = Math.min(devicePixelRatio || 1, 2);
              canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
            }
            addEventListener("resize", resize); resize();
            let last = performance.now(), camLook = null;
            const fmt = t => { t = ((t % 86400) + 86400) % 86400; return [t / 3600, t / 60 % 60, t % 60].map(x => String(Math.floor(x)).padStart(2, "0")).join(":"); };
          
            function frame(now) {
              const dt = Math.min(0.05, (now - last) / 1000); last = now;
              let notes = [];
              for (let i = 0; i < 4; i++) notes = notes.concat(stepSim(route, sim, dt / 4, input));
              input.openDoors = input.closeDoors = false;
              if (notes.length) toast(notes[notes.length - 1]);
          
              // camera
              const F = frameAt(tr, sim.s);
              let eye, target;
              if (camMode === 0) { eye = add(F.p, [0, 2.7, 0]); const T = frameAt(tr, sim.s + 60); target = add(T.p, [0, 2.2, 0]); }
              else if (camMode === 1) { const B = frameAt(tr, sim.s - 35); eye = add(add(B.p, scl(B.r, 9)), [0, 9, 0]); target = add(F.p, [0, 1.5, 0]); }
              else { const G = frameAt(tr, sim.s + 30); eye = add(add(G.p, scl(G.r, -14)), [0, 1.7 - G.ht, 0]); target = add(F.p, [0, 2, 0]); }
              camLook = camLook ? add(scl(camLook, 0.85), scl(target, 0.15)) : target;
              const proj = M.persp(camMode === 0 ? 1.0 : 0.9, canvas.width / canvas.height, 0.3, 4000);
              const view = M.look(eye, camLook, [0, 1, 0]), vp = M.mul(proj, view);
          
              gl.viewport(0, 0, canvas.width, canvas.height);
              gl.clearColor(...fog, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
              gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE);
              // sky
              gl.depthMask(false); gl.useProgram(sky.p);
              gl.uniformMatrix4fv(sky.u.uInvVP, false, M.inv(vp)); gl.uniform3fv(sky.u.uSun, sun); gl.uniform3fv(sky.u.uFog, fog);
              gl.bindVertexArray(skyVAO); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.depthMask(true);
              // world
              gl.useProgram(prog.p);
              const U = prog.u;
              gl.uniformMatrix4fv(U.uVP, false, vp); gl.uniform3fv(U.uSun, sun); gl.uniform3fv(U.uEye, eye); gl.uniform3fv(U.uFog, fog);
              gl.uniform1f(U.uFogD, 1400); gl.uniform4f(U.uTint, 0, 0, 0, 0); gl.uniform1i(U.uTex, 0);
              // ground (slightly below the local ground level)
              const gm = M.ident(); gm[12] = Math.round(eye[0] / 50) * 50; gm[13] = F.p[1] - F.ht - 0.05; gm[14] = Math.round(eye[2] / 50) * 50;
              gl.uniformMatrix4fv(U.uModel, false, gm); gl.uniform1i(U.uMode, 1);
              gl.bindVertexArray(ground.vao); gl.drawElements(gl.TRIANGLES, ground.n, gl.UNSIGNED_INT, 0);
              gl.uniformMatrix4fv(U.uModel, false, M.ident()); gl.uniform1i(U.uMode, 0);
              const kc = Math.floor(sim.s / CHUNK);
              for (let k = kc - 1; k <= kc + 6; k++) { if (k < 0) continue; const c = chunk(k); if (c) { gl.bindVertexArray(c.vao); gl.drawElements(gl.TRIANGLES, c.n, gl.UNSIGNED_INT, 0); } }
              for (const [k, c] of chunks) if ((k < kc - 2 || k > kc + 8) && c) { gl.deleteVertexArray(c.vao); c.bufs.forEach(b => gl.deleteBuffer(b)); chunks.delete(k); }
              // signs
              gl.uniform1i(U.uMode, 2); gl.disable(gl.CULL_FACE);
              route.stations.forEach((st, i) => { if (Math.abs(st.stop - sim.s) < 1500 && signs[i].mesh) {
                gl.bindTexture(gl.TEXTURE_2D, signs[i].tex); gl.bindVertexArray(signs[i].mesh.vao); gl.drawElements(gl.TRIANGLES, signs[i].mesh.n, gl.UNSIGNED_INT, 0); } });
              gl.enable(gl.CULL_FACE); gl.uniform1i(U.uMode, 0);
              // signal lamps
              gl.bindVertexArray(lamp.vao);
              for (const sig of route.signals) if (sig.s > sim.s - 50 && sig.s - sim.s < 1500) {
                const S = frameAt(tr, sig.s), c = add(add(S.p, scl(S.r, -2.3)), [0, 3.85, 0]);
                const red = signalRed(route, sim, sig);
                const m = M.ident(); m[0] = m[5] = m[10] = 0.26; m[12] = c[0] - S.f[0] * 0.16; m[13] = red ? c[1] - 0.3 : c[1] + 0.2; m[14] = c[2] - S.f[2] * 0.16;
                gl.uniformMatrix4fv(U.uModel, false, m);
                gl.uniform4f(U.uTint, red ? 1 : 0.1, red ? 0.08 : 1, red ? 0.05 : 0.35, 1);
                gl.drawElements(gl.TRIANGLES, lamp.n, gl.UNSIGNED_INT, 0);
              }
              gl.uniform4f(U.uTint, 0, 0, 0, 0);
              // the train itself (hidden in the cab view)
              if (camMode !== 0) for (let i = 0; i < NCARS; i++) {
                const sc = sim.s - CAR / 2 - i * (CAR + GAP);
                gl.uniformMatrix4fv(U.uModel, false, modelAt(sc));
                const mesh = i === 0 ? carLead : carMid;
                gl.bindVertexArray(mesh.vao); gl.drawElements(gl.TRIANGLES, mesh.n, gl.UNSIGNED_INT, 0);
              }
              gl.uniformMatrix4fv(U.uModel, false, M.ident());
          
              // HUD
              const kmh = sim.v * 3.6, lim = limitAt(route, sim.s);
              $("spd").innerHTML = `<div>${Math.round(kmh)}<span>km/h</span></div>`;
              $("arc").setAttribute("stroke-dasharray", `${Math.min(292, kmh / 120 * 292)} 400`);
              $("arc").setAttribute("stroke", sim.atp ? "#ffb000" : "#fff");
              $("lim").setAttribute("stroke-dasharray", lim < 900 ? `0 ${Math.max(0, Math.min(292, lim / 120 * 292) - 1.5)} 3 400` : "0 400");
              const shown = sim.doors !== "closed" ? Math.min(sim.notch, -4) : sim.atp ? Math.min(sim.notch, -7) : sim.ebLatch ? -8 : sim.notch;
              $("notch").textContent = notchName(shown);
              leverEl.querySelectorAll(".st").forEach(d => d.classList.toggle("on", +d.dataset.n === sim.notch));
              $("clock").textContent = fmt(sim.time);
              $("limit").textContent = lim < 900 ? lim + " km/h" : "—";
              $("score").textContent = sim.score;
              $("lATO").classList.toggle("on", sim.ato); $("lATP").classList.toggle("on", sim.atp);
              $("lDoor").classList.toggle("on", sim.doors !== "closed"); $("lSPAD").classList.toggle("on", sim.spad);
              const ni = nextStation(route, sim);
              if (sim.doors === "open") {
                const st = route.stations[sim.stIndex];
                const wait = st && st.dep !== null ? Math.max(0, Math.ceil(st.dep - sim.time)) : 0;
                $("nextName").textContent = st ? st.name : "—";
                $("nextInfo").textContent = wait > 0 ? `Doors open · depart in ${wait}s` : (sim.doorTimer > 15 ? "Ready · press Doors to close" : "Doors open · boarding");
              } else if (ni >= 0) {
                const st = route.stations[ni], d = st.stop - sim.s;
                $("nextName").textContent = st.name;
                $("nextInfo").textContent = `${d > 1000 ? (d / 1000).toFixed(2) + " km" : d.toFixed(1) + " m"}${st.arr !== null ? " · due " + fmt(st.arr).slice(0, 5) : ""} · doors ${st.side > 0 ? "right" : "left"}`;
              } else { $("nextName").textContent = "End of line"; $("nextInfo").textContent = `Final score ${sim.score}`; }
          
              if (ac) {
                const pw = shown > 0 ? shown / 4 : shown < 0 && sim.v > 0.5 ? 0.25 : 0;
                motor.frequency.setTargetAtTime(40 + sim.v * 14, ac.currentTime, 0.1);
                motorGain.gain.setTargetAtTime(Math.min(0.06, pw * 0.07) * Math.min(1, sim.v / 2 + 0.2), ac.currentTime, 0.1);
                rumbleGain.gain.setTargetAtTime(Math.min(0.25, sim.v / 25 * 0.25), ac.currentTime, 0.2);
              }
              requestAnimationFrame(frame);
            }
            if (ac && ac.state === "suspended") ac.resume();
            document.getElementById("start").style.display = "none";
            toast(route.stations.length ? `${route.stations[0].name} · doors open. Close the doors when it's time to go.` : "Ready");
            requestAnimationFrame(frame);
          }
          
          document.getElementById("go").onclick = () => startApp(DEMO_ROUTE);
          document.getElementById("file").onchange = async e => {
            const f = e.target.files[0]; if (!f) return;
            const buf = await f.arrayBuffer();
            let text;
            try { text = new TextDecoder("utf-8", { fatal: true }).decode(buf); }
            catch { try { text = new TextDecoder("shift_jis").decode(buf); } catch { text = new TextDecoder("latin1").decode(buf); } }
            startApp(text);
          };
          </script>
          </body>
          </html>
          HTML_EOF

      - name: Signing key (made once, then reused so updates install over the old app)
        run: |
          if [ ! -f openrail.keystore ]; then
            keytool -genkeypair -keystore openrail.keystore -alias openrail -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass openrail -keypass openrail -dname "CN=OpenRail"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add openrail.keystore
            git commit -m "Add app signing key"
            git push || echo "::warning::Could not save the signing key to the repo"
          fi

      - name: Build APK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$SDK/build-tools/$(ls "$SDK/build-tools" | sort -V | tail -1)"
          PLAT="$(ls "$SDK/platforms" | grep -E '^android-[0-9]+$' | sort -V | tail -1)"
          JAR="$SDK/platforms/$PLAT/android.jar"
          TARGET="${PLAT#android-}"
          echo "Build tools: $BT  Platform: $PLAT"
          cd app
          mkdir -p build/compiled build/classes
          "$BT/aapt2" compile res/drawable/ic_launcher.xml -o build/compiled/
          "$BT/aapt2" link -o build/unsigned.apk -I "$JAR" --manifest AndroidManifest.xml -A assets \
            build/compiled/*.flat --min-sdk-version 24 --target-sdk-version "$TARGET" \
            --version-code ${{ github.run_number }} --version-name "1.0.${{ github.run_number }}"
          javac -Xlint:-options -source 8 -target 8 -bootclasspath "$JAR" -d build/classes \
            src/sg/openrail/app/MainActivity.java
          "$BT/d8" --lib "$JAR" --min-api 24 --output build build/classes/sg/openrail/app/*.class
          (cd build && zip -q unsigned.apk classes.dex)
          "$BT/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk
          "$BT/apksigner" sign --ks ../openrail.keystore --ks-pass pass:openrail --key-pass pass:openrail \
            --out ../OpenRail.apk build/aligned.apk
          "$BT/apksigner" verify ../OpenRail.apk
          ls -l ../OpenRail.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: OpenRail 1.0.${{ github.run_number }}
          body: Install OpenRail.apk on your phone.
          files: OpenRail.apk
