# OpenRail for Android - builds an APK and publishes it to Releases.
# Put this file at .github/workflows/build-android.yml in its own repo.
name: Build OpenRail Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write app files
        run: |
          mkdir -p app/src/sg/openrail/app app/res/drawable app/assets
          cat > app/AndroidManifest.xml <<'MANIFEST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="sg.openrail.app">
              <uses-feature android:glEsVersion="0x00030000" android:required="true" />
              <application
                  android:label="OpenRail"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:hardwareAccelerated="true"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|navigation|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST_EOF
          cat > app/res/drawable/ic_launcher.xml <<'ICON_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#E4002B" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M34,26h40a8,8 0 0 1 8,8v34a8,8 0 0 1 -8,8h-40a8,8 0 0 1 -8,-8v-34a8,8 0 0 1 8,-8z" />
              <path android:fillColor="#1D2A36" android:pathData="M34,34h40v18h-40z" />
              <path android:fillColor="#00A650" android:pathData="M26,58h56v4h-56z" />
              <path android:fillColor="#FFFFFF" android:pathData="M36,76l-8,10h8l8,-10zM72,76l8,10h-8l-8,-10z" />
          </vector>
          ICON_EOF
          cat > app/src/sg/openrail/app/MainActivity.java <<'JAVA_EOF'
          package sg.openrail.app;
          
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          
          public class MainActivity extends Activity {
              private static final int PICK_FILE = 1;
              private WebView web;
              private ValueCallback<Uri[]> pendingPick;
          
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (pendingPick != null) pendingPick.onReceiveValue(null);
                          pendingPick = callback;
                          Intent pick = new Intent(Intent.ACTION_GET_CONTENT);
                          pick.addCategory(Intent.CATEGORY_OPENABLE);
                          pick.setType("*/*");
                          try {
                              startActivityForResult(Intent.createChooser(pick, "Choose an OpenBVE route (.csv)"), PICK_FILE);
                          } catch (Exception e) {
                              pendingPick = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  setContentView(web);
                  hideSystemBars();
                  if (state != null) web.restoreState(state);
                  else web.loadUrl("file:///android_asset/index.html");
              }
          
              @Override
              protected void onActivityResult(int request, int result, Intent data) {
                  super.onActivityResult(request, result, data);
                  if (request != PICK_FILE || pendingPick == null) return;
                  Uri[] picked = null;
                  if (result == RESULT_OK && data != null && data.getData() != null) picked = new Uri[] { data.getData() };
                  pendingPick.onReceiveValue(picked);
                  pendingPick = null;
              }
          
              @SuppressWarnings("deprecation")
              private void hideSystemBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }
          
              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }
          
              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }
          
              @Override
              protected void onPause() { super.onPause(); web.onPause(); }
          
              @Override
              protected void onResume() { super.onResume(); web.onResume(); hideSystemBars(); }
          
              @Override
              protected void onDestroy() { web.destroy(); super.onDestroy(); }
          }
          JAVA_EOF
          cat > app/assets/index.html <<'HTML_EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
          <title>OpenRail Prototype</title>
          <style>
          :root{--hud:rgba(10,14,20,.82);--line:rgba(255,255,255,.12);--txt:#eef2f6;--mute:#9aa6b2;--red:#e4002b;--grn:#00a650;--amb:#ffb000}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--txt);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none;user-select:none}
          canvas{display:block;width:100vw;height:100vh}
          #top{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;pointer-events:none;flex-wrap:wrap}
          .pill{background:var(--hud);border:1px solid var(--line);border-radius:12px;padding:7px 11px;backdrop-filter:blur(6px)}
          .pill small{display:block;color:var(--mute);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px}
          .pill b{font-size:16px;font-variant-numeric:tabular-nums}
          #next{flex:1;min-width:170px}#next b{font-size:15px}
          #dash{position:fixed;left:10px;bottom:10px;display:flex;gap:10px;align-items:flex-end;pointer-events:none}
          #speedo{width:150px;height:150px;background:var(--hud);border:1px solid var(--line);border-radius:50%;position:relative}
          #speedo svg{position:absolute;inset:0}
          #spd{position:absolute;inset:0;display:grid;place-items:center;font:700 34px system-ui;font-variant-numeric:tabular-nums}
          #spd span{display:block;font:500 11px system-ui;color:var(--mute);text-align:center;margin-top:-6px}
          #notch{font:700 22px system-ui;min-width:70px;text-align:center}
          #lamps{display:flex;gap:6px;flex-direction:column}
          .lamp{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:#222a33;color:#55606b;letter-spacing:.5px}
          .lamp.on{color:#111}.lamp.atp.on{background:var(--amb)}.lamp.door.on{background:#38bdf8}.lamp.ato.on{background:var(--grn);color:#fff}.lamp.spad.on{background:var(--red);color:#fff}
          #lever{position:fixed;right:12px;bottom:12px;top:96px;width:86px;background:var(--hud);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;padding:8px 6px}
          #lever .st{flex:1;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;border-radius:8px;color:var(--mute)}
          #lever .st.p{color:#86efac}#lever .st.b{color:#fca5a5}#lever .st.eb{color:#fff;background:#5b0d17}
          #lever .st.on{background:#fff;color:#000}
          #btns{position:fixed;right:108px;bottom:12px;display:flex;flex-direction:column;gap:8px}
          .btn{background:var(--hud);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:11px 14px;font:600 13px system-ui;min-width:76px;cursor:pointer}
          .btn:active{background:#2b3440}
          #toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);background:var(--hud);border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-weight:600;font-size:16px;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
          #start{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#1b2533,#07090c);display:flex;align-items:center;justify-content:center;z-index:9;padding:20px}
          #start .box{max-width:440px;text-align:center}
          #start h1{font-size:30px;margin:0 0 4px}#start h1 b{color:var(--red)}
          #start p{color:var(--mute);margin:8px 0}
          #start .go{background:var(--red);color:#fff;border:0;border-radius:14px;padding:15px 34px;font:700 18px system-ui;margin:14px 0 10px;cursor:pointer}
          #start label{display:inline-block;color:var(--mute);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px}
          #start input{display:none}
          .keys{font-size:12px;color:#6b7785;margin-top:12px}
          @media (max-width:640px){#speedo{width:118px;height:118px}#spd{font-size:27px}#lever{width:70px;top:132px}#btns{right:90px;bottom:auto;top:132px}.btn{min-width:64px;padding:10px}}
          </style>
          </head>
          <body>
          <canvas id="c"></canvas>
          <div id="top">
            <div class="pill" id="next"><small>Next stop</small><b id="nextName">—</b><div style="color:var(--mute);font-size:12px" id="nextInfo"></div></div>
            <div class="pill"><small>Time</small><b id="clock">--:--:--</b></div>
            <div class="pill"><small>Limit</small><b id="limit">--</b></div>
            <div class="pill"><small>Score</small><b id="score">0</b></div>
          </div>
          <div id="dash">
            <div id="speedo"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" fill="none" stroke="#28313b" stroke-width="9" stroke-dasharray="292 400" transform="rotate(135 75 75)"/>
              <circle id="arc" cx="75" cy="75" r="62" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="0 400" transform="rotate(135 75 75)"/>
              <circle id="lim" cx="75" cy="75" r="62" fill="none" stroke="var(--amb)" stroke-width="13" stroke-dasharray="2 400" transform="rotate(135 75 75)"/></svg>
              <div id="spd"><div>0<span>km/h</span></div></div></div>
            <div class="pill"><small>Handle</small><div id="notch">N</div></div>
            <div id="lamps"><div class="lamp ato" id="lATO">ATO</div><div class="lamp atp" id="lATP">ATP</div><div class="lamp door" id="lDoor">DOOR</div><div class="lamp spad" id="lSPAD">SPAD</div></div>
          </div>
          <div id="btns"><button class="btn" id="bDoor">Doors</button><button class="btn" id="bATO">ATO</button><button class="btn" id="bCam">Camera</button><button class="btn" id="bHorn">Horn</button></div>
          <div id="lever"></div>
          <div id="toast"></div>
          <div id="start"><div class="box">
            <h1><b>Open</b>Rail</h1>
            <p>A modern, browser-based train sim prototype that reads OpenBVE <code>.csv</code> route files.</p>
            <p style="font-size:13px">Built-in demo: a made-up elevated line using East West Line station names. The layout is not real.</p>
            <button class="go" id="go">Start driving</button><br>
            <label>Or load your own OpenBVE route (.csv)<input type="file" id="file" accept=".csv,.txt"></label>
            <div class="keys">Keys: W / ↑ more power · S / ↓ more brake · Backspace emergency brake · D doors · O ATO · C camera · H horn</div>
          </div></div>
          
          <script>
          "use strict";
          /* ================================================================
             1. ROUTE PARSER  (subset of the OpenBVE CSV route format)
             Supported: .Curve .Pitch .Height .Sta .Stop .Limit .Section .Signal
             Route.Comment, With Track/Route blocks, both "cmd a;b" and "cmd(a;b)".
             Objects (.FreeObj, .Rail, structures) are ignored for now: scenery is
             generated procedurally instead.
          ================================================================ */
          const DEMO_ROUTE = `; OpenRail demo - fictional layout, EWL station names
          With Route
          .Comment Demo line, elevated, 6 stations
          .Timetable Demo
          With Track
          0, .Height 8, .Sta Pasir Ris;;07.00.00;0;-1, .Limit 80
          140, .Stop -1
          160, .Section 0;2
          420, .Curve 900;0
          900, .Curve 0;0
          1300, .Pitch -12
          1600, .Pitch 0
          1900, .Sta Tampines;07.02.30;07.03.00;0;-1
          2040, .Stop -1
          2060, .Section 0;2
          2300, .Curve -650;0, .Limit 65
          2800, .Curve 0;0, .Limit 80
          3300, .Sta Simei;07.05.00;07.05.30;0;1
          3440, .Stop 1
          3460, .Section 0;2
          3700, .Pitch 15
          4000, .Pitch 0
          4100, .Curve 1200;0
          4700, .Curve 0;0, .Limit 90
          5300, .Sta Tanah Merah;07.08.00;07.08.40;0;-1
          5440, .Stop -1
          5460, .Section 0;2
          5700, .Curve -800;0, .Limit 70
          6200, .Curve 0;0, .Limit 80
          6400, .Height 4
          6800, .Sta Bedok;07.10.40;07.11.10;0;1
          6940, .Stop 1
          6960, .Section 0;2
          7400, .Curve 700;0
          7900, .Curve 0;0
          8300, .Sta Kembangan;07.13.20;;0;-1
          8440, .Stop -1
          8600, .Limit 0
          `;
          
          function parseTime(t) { // OpenBVE style HH.MMSS, also HH:MM:SS
            if (!t) return null;
            t = String(t).trim();
            if (!t) return null;
            let m = t.match(/^(\d{1,2})[.:](\d{2})(?:[.:]?(\d{2}))?$/);
            if (!m) return null;
            return (+m[1]) * 3600 + (+m[2]) * 60 + (m[3] ? +m[3] : 0);
          }
          
          function splitOutside(line, sep) { // split on sep, but not inside ( )
            const out = []; let depth = 0, cur = "";
            for (const ch of line) {
              if (ch === "(") depth++;
              if (ch === ")") depth = Math.max(0, depth - 1);
              if (ch === sep && depth === 0) { out.push(cur); cur = ""; } else cur += ch;
            }
            out.push(cur);
            return out;
          }
          
          function parseRoute(text) {
            const route = { comment: "", curves: [], pitches: [], heights: [], stations: [], limits: [], signals: [], length: 0 };
            let ns = "track", pos = 0;
            for (let raw of text.split(/\r?\n/)) {
              let line = raw.trim();
              if (!line || line.startsWith(";")) continue;
              for (let item of splitOutside(line, ",")) {
                item = item.trim();
                if (!item) continue;
                if (/^-?\d+(\.\d+)?$/.test(item)) { pos = parseFloat(item); route.length = Math.max(route.length, pos); continue; }
                let w = item.match(/^with\s+(\w+)/i);
                if (w) { ns = w[1].toLowerCase(); continue; }
                let m = item.match(/^(?:(\w+)\.|\.)?(\w+)\s*(?:\((.*)\)\s*(.*)|(.*))$/);
                if (!m) continue;
                const space = (m[1] || ns).toLowerCase();
                const cmd = m[2].toLowerCase();
                const argStr = m[3] !== undefined ? m[3] + (m[4] ? ";" + m[4] : "") : (m[5] || "");
                const a = argStr.split(/[;,]/).map(s => s.trim());
                const num = (i, d) => { const v = parseFloat(a[i]); return isFinite(v) ? v : d; };
                if (space === "route" && cmd === "comment") { route.comment = argStr.trim(); continue; }
                if (space !== "track") continue;
                switch (cmd) {
                  case "curve": route.curves.push({ s: pos, r: num(0, 0) }); break;
                  case "pitch": route.pitches.push({ s: pos, p: num(0, 0) }); break;
                  case "height": route.heights.push({ s: pos, h: num(0, 0) }); break;
                  case "limit": route.limits.push({ s: pos, v: num(0, 0) }); break;
                  case "sta": route.stations.push({ s: pos, name: a[0] || "Station", arr: parseTime(a[1]), dep: parseTime(a[2]),
                    doors: num(4, -1), stop: null }); break;
                  case "stop": {
                    const st = route.stations[route.stations.length - 1];
                    if (st && st.stop === null && pos >= st.s && pos - st.s < 600) { st.stop = pos; st.side = num(0, st.doors || -1); }
                    break;
                  }
                  case "section": case "signal": case "sigf": route.signals.push({ s: pos }); break;
                }
              }
            }
            for (const st of route.stations) {
              if (st.stop === null) st.stop = st.s + 100;
              if (!st.side) st.side = st.doors > 0 ? 1 : -1;
              route.length = Math.max(route.length, st.stop + 50);
            }
            route.length += 400;
            const byS = (x, y) => x.s - y.s;
            ["curves", "pitches", "heights", "limits", "signals"].forEach(k => route[k].sort(byS));
            return route;
          }
          
          /* value of a piecewise-constant list at s */
          function stepAt(list, s, key, def) {
            let v = def;
            for (const e of list) { if (e.s <= s) v = e[key]; else break; }
            return v;
          }
          
          /* ================================================================
             2. TRACK GEOMETRY  - integrate heading and elevation along s
          ================================================================ */
          const DS = 2.5;
          function buildTrack(route) {
            const n = Math.ceil(route.length / DS) + 2;
            const X = new Float64Array(n), Y = new Float64Array(n), Z = new Float64Array(n), H = new Float64Array(n),
                  HT = new Float64Array(n), R = new Float64Array(n);
            let x = 0, y = 0, z = 0, h = 0;
            // rail height above ground: interpolate between .Height commands
            const hp = route.heights.length ? route.heights : [{ s: 0, h: 0.3 }];
            const heightAt = s => {
              if (s <= hp[0].s) return hp[0].h;
              for (let i = 0; i < hp.length - 1; i++)
                if (s < hp[i + 1].s) { const t = (s - hp[i].s) / (hp[i + 1].s - hp[i].s); return hp[i].h + (hp[i + 1].h - hp[i].h) * t; }
              return hp[hp.length - 1].h;
            };
            for (let i = 0; i < n; i++) {
              const s = i * DS;
              X[i] = x; Y[i] = y; Z[i] = z; H[i] = h; HT[i] = heightAt(s);
              const r = stepAt(route.curves, s, "r", 0); R[i] = r;
              const p = stepAt(route.pitches, s, "p", 0);
              if (r !== 0) h += DS / r;
              x += Math.sin(h) * DS; z -= Math.cos(h) * DS; y += p / 1000 * DS;
            }
            const baseY = HT[0];
            for (let i = 0; i < n; i++) Y[i] += baseY; // so ground at s=0 is y=0
            return { n, X, Y, Z, H, HT, R, len: (n - 1) * DS };
          }
          
          /* position + frame at distance s (interpolated) */
          function frameAt(tr, s) {
            s = Math.max(0, Math.min(tr.len - 0.001, s));
            const i = Math.floor(s / DS), t = s / DS - i, j = Math.min(i + 1, tr.n - 1);
            const L = (A) => A[i] + (A[j] - A[i]) * t;
            const h = L(tr.H);
            const f = [Math.sin(h), (tr.Y[j] - tr.Y[i]) / DS, -Math.cos(h)];
            return { p: [L(tr.X), L(tr.Y), L(tr.Z)], f, r: [Math.cos(h), 0, Math.sin(h)], ht: L(tr.HT), radius: tr.R[i] };
          }
          
          /* ================================================================
             3. TRAIN PHYSICS + SIGNALLING + ATO
          ================================================================ */
          const NOTCH_MIN = -8, NOTCH_MAX = 4; // -8 EB, -7..-1 B7..B1, 0 N, 1..4 P1..P4
          function notchName(n) { return n === -8 ? "EB" : n < 0 ? "B" + (-n) : n === 0 ? "N" : "P" + n; }
          
          function accelFor(notch, v, pitch) { // v in m/s, returns m/s^2
            let a = 0;
            if (notch > 0) { const amax = v < 10 ? 1.0 : 1.0 * 10 / v; a = amax * notch / 4; }
            else if (notch < 0) a = notch === -8 ? -1.4 : -1.1 * (-notch) / 7;
            const resist = v > 0.01 ? 0.012 + 0.00005 * v * v : 0;
            a -= resist + 9.81 * pitch / 1000;
            return a;
          }
          
          function makeSim(route) {
            const first = route.stations[0];
            const startS = first ? first.stop : 30;
            const t0 = first && first.dep !== null ? first.dep - 25 : 7 * 3600;
            return { s: startS, v: 0, notch: -7, time: t0, score: 0, ato: false, atp: false, spad: false,
                     doors: first ? "open" : "closed", doorTimer: first ? 0 : 0, stIndex: first ? 0 : -1,
                     departOK: false, msg: "", ebLatch: false };
          }
          
          function limitAt(route, s) { const v = stepAt(route.limits, s, "v", 0); return v > 0 ? v : 999; }
          function pitchAt(route, s) { return stepAt(route.pitches, s, "p", 0); }
          
          /* the station the train should stop at next (index), or -1 */
          function nextStation(route, sim) {
            for (let i = 0; i < route.stations.length; i++) {
              if (route.stations[i].stop > sim.s - 6 && !(i === sim.stIndex && sim.departOK)) return i;
            }
            return -1;
          }
          
          /* signal aspect: red if it is the starter of the station we're dwelling at */
          function signalRed(route, sim, sig) {
            if (sim.stIndex < 0 || sim.departOK) return false;
            const st = route.stations[sim.stIndex];
            return sig.s > st.stop && sig.s - st.stop < 80;
          }
          
          function atoNotch(route, sim) {
            const ni = nextStation(route, sim);
            if (ni < 0) return -7; // end of the line
            const v = sim.v * 3.6, ms = sim.v, BSTEP = 1.1 / 7;
            let target = limitAt(route, sim.s) - 4, need = 0; // need = deceleration required (m/s^2)
            const plan = (d, vEnd) => { if (d > 0.05 && ms > vEnd) need = Math.max(need, (ms * ms - vEnd * vEnd) / (2 * d)); };
            // look ahead for lower limits
            for (const L of route.limits) if (L.s > sim.s && L.s - sim.s < 800 && L.v > 0) plan(L.s - sim.s, (L.v - 4) / 3.6);
            if (ni >= 0) {
